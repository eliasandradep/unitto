<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Unitto</title>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}" />

  <!-- PWA -->
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}" />
  <meta name="theme-color" content="#1B2D6E" />
  <link rel="icon" href="{{ url_for('static', filename='images/favicon-32.png') }}" sizes="32x32" />
  <link rel="icon" href="{{ url_for('static', filename='images/favicon-64.png') }}" sizes="64x64" />
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/apple-touch-icon.png') }}" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Unitto" />
</head>
<body class="admin-body admin-body--auth">

  <div class="auth-card">
    <div class="auth-card__logo" style="width:72px;height:72px;background:#1a1a2e;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;font-size:1.8rem;font-weight:700;color:#c1904f;font-family:'Jost',sans-serif;letter-spacing:-.02em">U</div>
    <h2 style="margin:.2rem 0 .1rem;font-size:1.3rem;font-weight:700">Unitto</h2>
    <p style="color:#888;font-size:.82rem;margin:0 0 1.2rem">Gestão Unificada</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert--{{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="{{ url_for('admin.login') }}">
      <div class="form-group">
        <label>E-mail</label>
        <input type="email" name="email" autofocus required />
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" name="password" required />
      </div>
      <button type="submit" class="btn-primary btn-full">Entrar</button>
    </form>

    <p style="text-align:center;margin-top:1rem;font-size:.82rem">
      <a href="{{ url_for('admin.forgot_password') }}">Esqueci minha senha</a>
    </p>
  </div>

  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js', { scope: '/admin/' }).catch(function () {});
    });
  }
  </script>

</body>
</html>
